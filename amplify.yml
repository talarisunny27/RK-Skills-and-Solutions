version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - env | grep -e '^NEXT_PUBLIC_' >> .env.production
        - env | grep -e '^CLERK_SECRET_KEY=' >> .env.production
        - env | grep -e '^RESEND_API_KEY=' >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
